name: Temporary Local Qwen3 Math Benchmark

on:
  push:
    branches:
      - tmp-ai-math-benchmark-20260812
    paths:
      - '.github/workflows/tmp_ai_math_qwen3.yml'
      - 'temporary/ai_math_qwen3/**'

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: '1'
  OLLAMA_NUM_PARALLEL: '1'
  OLLAMA_MAX_LOADED_MODELS: '1'

jobs:
  evaluate-qwen3:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out benchmark branch
        uses: actions/checkout@v4

      - name: Record runner environment
        run: |
          mkdir -p evidence_qwen3
          python --version | tee evidence_qwen3/runner_environment.txt
          uname -a | tee -a evidence_qwen3/runner_environment.txt
          lscpu | tee -a evidence_qwen3/runner_environment.txt
          free -h | tee -a evidence_qwen3/runner_environment.txt
          git rev-parse HEAD | tee -a evidence_qwen3/runner_environment.txt

      - name: Install and start Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama --version | tee evidence_qwen3/ollama_version.txt
          nohup ollama serve > evidence_qwen3/ollama_server.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then
              break
            fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:11434/api/tags

      - name: Pull exact open-weight reasoning model
        run: |
          ollama pull qwen3:4b
          ollama list | tee evidence_qwen3/ollama_list.txt
          ollama show qwen3:4b --modelfile | tee evidence_qwen3/model_modelfile.txt

      - name: Run fixed-prompt local-model evaluation
        run: python temporary/ai_math_qwen3/run_qwen3_ollama.py

      - name: Upload immutable raw evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-math-qwen3-evidence
          path: evidence_qwen3/
          if-no-files-found: error
          retention-days: 7

name: Temporary reference PDF bundle

on:
  push:
    paths:
      - '.github/workflows/tmp-reference-pdf-bundle.yml'

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download legally public PDFs
        shell: bash
        run: |
          python - <<'PY'
          import csv
          import hashlib
          import os
          import re
          import time
          from pathlib import Path
          from urllib.parse import urljoin

          import requests

          out = Path('reference_pdfs')
          out.mkdir(exist_ok=True)
          session = requests.Session()
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (compatible; academic-reference-collector/1.0; +https://github.com/Twave1717/Detecting-FAKE-TXT)'
          })

          entries = [
              {
                  'no': 1,
                  'filename': '01_Bastani_et_al_2025_Generative_AI_without_guardrails_can_harm_learning.pdf',
                  'version': 'Version of record / PNAS open-access copy',
                  'urls': [
                      'https://www.pnas.org/doi/epdf/10.1073/pnas.2422633122',
                      'https://pmc.ncbi.nlm.nih.gov/articles/PMC12232635/'
                  ],
              },
              {
                  'no': 2,
                  'filename': '02_Bratsberg_Rogeberg_2018_Flynn_effect_and_its_reversal.pdf',
                  'version': 'Version of record / PNAS open-access copy',
                  'urls': [
                      'https://www.pnas.org/doi/epdf/10.1073/pnas.1718793115',
                      'https://pmc.ncbi.nlm.nih.gov/articles/PMC6042097/'
                  ],
              },
              {
                  'no': 4,
                  'filename': '04_Fisher_Goddu_Keil_2015_Searching_for_explanations.pdf',
                  'version': 'Publisher-authorized public PDF (APA)',
                  'urls': [
                      'https://www.apa.org/pubs/journals/releases/xge-0000070.pdf',
                      'https://campuspress.yale.edu/matthewfisher/files/2015/03/pdf-16ueczx.pdf'
                  ],
              },
              {
                  'no': 6,
                  'filename': '06_Dlugosz_et_al_2026_Critical_re-evaluation_of_GSM-Symbolic.pdf',
                  'version': 'Official arXiv preprint',
                  'urls': ['https://arxiv.org/pdf/2605.28700.pdf'],
              },
              {
                  'no': 7,
                  'filename': '07_Huang_et_al_2024_LLMs_cannot_self-correct_reasoning_yet.pdf',
                  'version': 'Official arXiv / ICLR preprint',
                  'urls': ['https://arxiv.org/pdf/2310.01798.pdf'],
              },
              {
                  'no': 8,
                  'filename': '08_Kamoi_et_al_2024_When_can_LLMs_correct_their_own_mistakes.pdf',
                  'version': 'Official ACL Anthology PDF',
                  'urls': ['https://aclanthology.org/2024.tacl-1.78.pdf'],
              },
              {
                  'no': 10,
                  'filename': '10_Lea_et_al_2023_Evolutionary_mismatch_framework.pdf',
                  'version': 'Version of record / PLOS open access',
                  'urls': ['https://journals.plos.org/plosbiology/article/file?id=10.1371/journal.pbio.3002311&type=printable'],
              },
              {
                  'no': 11,
                  'filename': '11_Li_et_al_2024_GSM-Plus.pdf',
                  'version': 'Official ACL Anthology PDF',
                  'urls': ['https://aclanthology.org/2024.acl-long.163.pdf'],
              },
              {
                  'no': 13,
                  'filename': '13_Mirzadeh_et_al_GSM-Symbolic_ICLR2025.pdf',
                  'version': 'Official ICLR 2025 proceedings PDF',
                  'urls': [
                      'https://proceedings.iclr.cc/paper_files/paper/2025/file/ec2e7a896f8250986b3907f57621ce94-Paper-Conference.pdf',
                      'https://arxiv.org/pdf/2410.05229.pdf'
                  ],
              },
              {
                  'no': 16,
                  'filename': '16_Porubsky_et_al_2025_Human_de_novo_mutation_rates.pdf',
                  'version': 'Version of record / Nature CC BY',
                  'urls': [
                      'https://www.nature.com/articles/s41586-025-08922-2.pdf',
                      'https://pmc.ncbi.nlm.nih.gov/articles/PMC12240836/'
                  ],
              },
              {
                  'no': 17,
                  'filename': '17_Risko_Gilbert_2016_Cognitive_offloading.pdf',
                  'version': 'Accepted manuscript / UCL CC BY-NC-ND',
                  'urls': ['https://discovery.ucl.ac.uk/id/eprint/1508770/1/gilbert_TiCS_OFFLOADING_RPS.pdf'],
              },
              {
                  'no': 19,
                  'filename': '19_Sauerbrei_Pruszynski_2025_Brain_more_than_10_bits.pdf',
                  'version': 'Author manuscript / PubMed Central',
                  'urls': ['https://pmc.ncbi.nlm.nih.gov/articles/PMC12320479/'],
              },
              {
                  'no': 20,
                  'filename': '20_Wang_et_al_2023_Human_generation_times.pdf',
                  'version': 'Version of record / Science Advances open access',
                  'urls': ['https://pmc.ncbi.nlm.nih.gov/articles/PMC9821931/'],
              },
              {
                  'no': 21,
                  'filename': '21_Yang_et_al_2025_Confidence_vs_Critique.pdf',
                  'version': 'Official ACL Anthology PDF',
                  'urls': ['https://aclanthology.org/2025.acl-long.203.pdf'],
              },
              {
                  'no': 22,
                  'filename': '22_Zhang_et_al_2025_Dark_side_of_intrinsic_self-correction.pdf',
                  'version': 'Official ACL Anthology PDF',
                  'urls': ['https://aclanthology.org/2025.acl-long.1314.pdf'],
              },
              {
                  'no': 23,
                  'filename': '23_Zheng_Meister_2025_Unbearable_slowness_of_being.pdf',
                  'version': 'Official arXiv preprint',
                  'urls': ['https://arxiv.org/pdf/2408.10234.pdf'],
              },
          ]

          def is_pdf(data: bytes) -> bool:
              return data.lstrip().startswith(b'%PDF-') and len(data) > 10_000

          def candidate_pdf_links(base_url: str, html: str):
              links = []
              for href in re.findall(r'href=[\"\']([^\"\']+)[\"\']', html, flags=re.I):
                  low = href.lower()
                  if '.pdf' in low or '/pdf/' in low or 'report=pdf' in low:
                      links.append(urljoin(base_url, href))
              # preserve order, deduplicate
              seen = set()
              return [u for u in links if not (u in seen or seen.add(u))]

          def fetch_pdf(url: str):
              r = session.get(url, timeout=90, allow_redirects=True)
              r.raise_for_status()
              if is_pdf(r.content):
                  return r.content, r.url
              ctype = (r.headers.get('content-type') or '').lower()
              if 'html' in ctype or r.text.lstrip().startswith('<'):
                  for link in candidate_pdf_links(r.url, r.text):
                      try:
                          rr = session.get(link, timeout=90, allow_redirects=True)
                          rr.raise_for_status()
                          if is_pdf(rr.content):
                              return rr.content, rr.url
                      except Exception:
                          continue
              raise RuntimeError(f'No PDF obtained; content-type={ctype}, final_url={r.url}')

          rows = []
          for entry in entries:
              success = False
              errors = []
              used_url = ''
              for url in entry['urls']:
                  try:
                      data, used_url = fetch_pdf(url)
                      path = out / entry['filename']
                      path.write_bytes(data)
                      rows.append({
                          'no': entry['no'],
                          'filename': entry['filename'],
                          'version': entry['version'],
                          'status': 'downloaded',
                          'source_url': used_url,
                          'bytes': len(data),
                          'sha256': hashlib.sha256(data).hexdigest(),
                          'error': '',
                      })
                      success = True
                      break
                  except Exception as exc:
                      errors.append(f'{url} :: {type(exc).__name__}: {exc}')
                      time.sleep(1)
              if not success:
                  rows.append({
                      'no': entry['no'],
                      'filename': entry['filename'],
                      'version': entry['version'],
                      'status': 'failed',
                      'source_url': '',
                      'bytes': 0,
                      'sha256': '',
                      'error': ' | '.join(errors),
                  })

          fields = ['no','filename','version','status','source_url','bytes','sha256','error']
          with (out / 'workflow_download_status.csv').open('w', newline='', encoding='utf-8-sig') as f:
              w = csv.DictWriter(f, fieldnames=fields)
              w.writeheader(); w.writerows(rows)

          with (out / 'README.txt').open('w', encoding='utf-8') as f:
              f.write('This artifact contains only PDFs obtained from openly accessible publisher, repository, conference, or preprint sources.\n')
              f.write('Paywalled or redistribution-restricted references were intentionally not downloaded.\n')
              f.write('See workflow_download_status.csv for source URLs, versions, hashes, and failures.\n')

          print('Downloaded:', sum(r['status']=='downloaded' for r in rows), '/', len(rows))
          for r in rows:
              print(r['no'], r['status'], r['filename'], r['error'][:200])
          PY

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: Math_for_CORE_ch8_reference_pdfs
          path: reference_pdfs/
          if-no-files-found: error
          retention-days: 1

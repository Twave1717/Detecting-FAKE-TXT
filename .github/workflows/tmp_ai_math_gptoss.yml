name: Temporary Local GPT-OSS Ocean Math Benchmark

on:
  push:
    branches:
      - tmp-ai-math-benchmark-20260812
    paths:
      - '.github/workflows/tmp_ai_math_gptoss.yml'
      - 'temporary/ai_math_gptoss/**'

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: '1'
  OLLAMA_NUM_PARALLEL: '1'
  OLLAMA_MAX_LOADED_MODELS: '1'

jobs:
  evaluate-gptoss:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Check out benchmark branch
        uses: actions/checkout@v4

      - name: Record runner environment
        run: |
          mkdir -p evidence_gptoss
          python --version | tee evidence_gptoss/runner_environment.txt
          uname -a | tee -a evidence_gptoss/runner_environment.txt
          lscpu | tee -a evidence_gptoss/runner_environment.txt
          free -h | tee -a evidence_gptoss/runner_environment.txt
          git rev-parse HEAD | tee -a evidence_gptoss/runner_environment.txt

      - name: Install and start Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama --version | tee evidence_gptoss/ollama_version.txt
          nohup ollama serve > evidence_gptoss/ollama_server.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then
              break
            fi
            sleep 2
          done

      - name: Pull exact OpenAI open-weight reasoning model
        run: |
          ollama pull gpt-oss:20b
          ollama list | tee evidence_gptoss/ollama_list.txt
          ollama show gpt-oss:20b --modelfile | tee evidence_gptoss/model_modelfile.txt

      - name: Run fixed-prompt high-reasoning evaluation
        run: python temporary/ai_math_gptoss/run_gptoss_ollama.py

      - name: Upload immutable raw evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-math-gptoss-evidence
          path: evidence_gptoss/
          if-no-files-found: error
          retention-days: 7

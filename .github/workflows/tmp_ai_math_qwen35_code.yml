name: Temporary Qwen3.5 Executable Ocean Math Code Test

on:
  push:
    branches:
      - tmp-ai-math-benchmark-20260812
    paths:
      - '.github/workflows/tmp_ai_math_qwen35_code.yml'
      - 'temporary/ai_math_qwen35_code/**'

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: '1'
  OLLAMA_NUM_PARALLEL: '1'
  OLLAMA_MAX_LOADED_MODELS: '1'

jobs:
  evaluate-qwen35-code:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Check out benchmark branch
        uses: actions/checkout@v4

      - name: Record runner environment
        run: |
          mkdir -p evidence_qwen35_code
          python --version | tee evidence_qwen35_code/runner_environment.txt
          uname -a | tee -a evidence_qwen35_code/runner_environment.txt
          lscpu | tee -a evidence_qwen35_code/runner_environment.txt
          free -h | tee -a evidence_qwen35_code/runner_environment.txt
          git rev-parse HEAD | tee -a evidence_qwen35_code/runner_environment.txt

      - name: Install R and start Ollama
        run: |
          sudo apt-get update -y
          sudo apt-get install -y r-base-core r-cran-jsonlite
          Rscript --version 2>&1 | tee evidence_qwen35_code/r_version.txt
          curl -fsSL https://ollama.com/install.sh | sh
          ollama --version | tee evidence_qwen35_code/ollama_version.txt
          nohup ollama serve > evidence_qwen35_code/ollama_server.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then
              break
            fi
            sleep 2
          done

      - name: Pull exact current-generation open-weight model
        run: |
          ollama pull qwen3.5:4b
          ollama list | tee evidence_qwen35_code/ollama_list.txt
          ollama show qwen3.5:4b --modelfile | tee evidence_qwen35_code/model_modelfile.txt

      - name: Generate code and execute objective tests
        run: python temporary/ai_math_qwen35_code/run_code_eval.py

      - name: Upload immutable raw and execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-math-qwen35-code-evidence
          path: evidence_qwen35_code/
          if-no-files-found: error
          retention-days: 7
